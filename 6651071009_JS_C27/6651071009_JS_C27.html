<title>Câu 27 - Bảng tính tiền có chức năng xóa dòng</title>
</head>
<body>
  <table border="1" id="bangTinh">
    <tr>
      <th>Số lượng</th>
      <th>Đơn giá</th>
      <th>Tổng</th>
      <th>Chức năng</th>
    </tr>
    <tr>
      <td><input type="text" value="2" onchange="capNhatTong(this)"></td>
      <td><input type="text" value="1000000" onchange="capNhatTong(this)"></td>
      <td><input type="text" value="2000000" readonly></td>
      <td><input type="button" value="Xóa" onclick="xoaDong(this)"></td>
    </tr>
    <tr>
      <td><input type="text" value="1" onchange="capNhatTong(this)"></td>
      <td><input type="text" value="500000" onchange="capNhatTong(this)"></td>
      <td><input type="text" value="500000" readonly></td>
      <td><input type="button" value="Xóa" onclick="xoaDong(this)"></td>
    </tr>
  </table>
